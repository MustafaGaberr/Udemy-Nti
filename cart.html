<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
    <style>
        .cart-summary {
            background-color: #f8f9fa;
        }

        .btn-burbleBg {
            background-color: #a435f0;
            color: white;
        }

        .cart-item {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <h1 class="mb-5">Shopping Cart</h1>
        <div class="row">
            <div class="col-lg-8" id="cart-items">
                <!-- cart items -->
                <div class="card mb-4 cart-item" data-price="99.99">
                    <div class="card-body row align-items-center">
                        <div class="col-md-3">
                            <a href="#" target="_blank"><img
                                    src="https://media.licdn.com/dms/image/v2/D4D12AQH5WGa2Z9Ieiw/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1690880909231?e=2147483647&v=beta&t=LHtapkFGyodH5tJbvb0G5fJIEidoQETSJx02J93CjiQ"
                                    class="img-fluid rounded"></a>
                        </div>
                        <div class="col-md-5">
                            <h5 class="card-title">Course 1</h5>
                            <p class="text-muted">Course description</p>
                        </div>
                        <div class="col-md-2 text-end">
                            <p class="fw-bold">$99.99</p>
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-sm btn-outline-danger remove-item">Remove</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card cart-summary p-3">
                    <h5>Order Summary</h5>
                    <p>Subtotal: $<span id="subtotal">99.99</span></p>
                    <p>Discount: $<span id="discount">0</span></p>
                    <hr>
                    <h5>Total: $<span id="total">99.99</span></h5>
                    <button class="btn btn-burbleBg w-100 mb-2" id="checkout-btn">Proceed to Checkout</button>
                    <p class="text-muted text-center">You won't be charged yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
      
const removeButtons = document.querySelectorAll('.remove-item');
const subtotalEl = document.getElementById('subtotal');
const totalEl = document.getElementById('total');
const checkoutBtn = document.getElementById('checkout-btn');

function updateTotal() {
    let subtotal = 0;
    const cartItems = [];

    document.querySelectorAll('.cart-item').forEach(item => {
        const price = parseFloat(item.dataset.price);
        subtotal += price;

        const title = item.querySelector('.card-title').textContent;
        const desc = item.querySelector('.text-muted').textContent;
        const img = item.querySelector('img').src;

        cartItems.push({ title, desc, img, price });
    });

    subtotalEl.textContent = subtotal.toFixed(2);
    totalEl.textContent = subtotal.toFixed(2);

    // Save cart to localStorage
    localStorage.setItem('cart', JSON.stringify(cartItems));
}

removeButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.target.closest('.cart-item').remove();
        updateTotal();
    });
});

// Redirect to checkout
checkoutBtn.addEventListener('click', () => {
    window.location.href = 'checkout.html';
});

updateTotal();
</script>

    </script>
</body>

</html>
